name: CI

# Health checks only, not a deploy pipeline (Render and Vercel deploy from main on their own).
# Everything here is offline and needs no secrets: it never calls Groq, Supabase or Render, so a
# PR (including one from a fork) cannot spend quota or touch production. The LLM evaluation lives in
# genai/eval and is run by hand.
#
# Jobs run in parallel (the repo is public, so runner minutes are free and fast feedback matters
# more than saving them). `ci-pass` is the single status to require if branch protection is enabled.

on:
  push:
    branches: [main]
    # The auto-commit job (systemd/autocommit-dashboard-data.sh) pushes exported data to main every
    # two hours; those commits change nothing that is tested.
    paths-ignore:
      - "dashboard/data/**"
  pull_request:

# Cancel superseded runs on pull requests only: a run on main should finish so every main commit
# keeps a recorded result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  backend:
    name: "backend (compile, pytest)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          # Render runs Python 3.14; test the same major.minor.
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install
        run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt requests
      - name: Compile every Python module that ships or is run by a job
        run: |
          python -m py_compile backend/main.py backend/activity.py backend/assistant/*.py \
            ingestion/*.py genai/build_corpus.py genai/eval/*.py
      - name: Backend tests (assistant, grounding, router, retrieval, rate limits, activity)
        run: python -m pytest backend/tests -q
      - name: Evaluation-code tests (scoring, judge windows; no API calls)
        run: python -m pytest genai/eval -q

  corpus-fresh:
    name: "assistant corpus is up to date"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      # Render deploys only backend/, so the docs the assistant searches are committed as
      # backend/assistant/corpus.json. Editing FINDINGS/ARCHITECTURE/SCOPE/DATA_SOURCES without
      # rebuilding it silently degrades answers.
      - run: python genai/build_corpus.py --check

  dashboard:
    name: "dashboard (eslint, tsc)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: ./node_modules/.bin/tsc --noEmit
      # `next build` is deliberately not run: it fetches live data from the Render API at build time,
      # so it would fail whenever Render is asleep. Vercel builds every push anyway.

  hygiene:
    name: "hygiene (whitespace, shell syntax)"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Whitespace errors introduced by this pull request
        if: github.event_name == 'pull_request'
        run: git diff --check "origin/${{ github.base_ref }}...HEAD"
      - name: Shell scripts parse
        run: |
          for f in $(git ls-files '*.sh'); do
            echo "bash -n $f"; bash -n "$f"
          done

  ci-pass:
    name: CI passed
    if: always()
    needs: [backend, corpus-fresh, dashboard, hygiene]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Every job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do
            [ "$r" = "success" ] || { echo "a required job did not succeed"; exit 1; }
          done
